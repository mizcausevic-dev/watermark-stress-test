          "@type": "Question",
          "name": "Are AI image and text watermarks reliable for proving content origin?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pixel- and token-level watermarks are robust against many casual transformations but remain fragile against targeted edits such as frequency-band filtering, re-encoding, rescaling, paraphrasing, and character substitution. Because robustness is not guaranteed, watermarking is best treated as one signal among several rather than as proof of origin."
          }
        },
        {
          "@type": "Question",
          "name": "What is the durable alternative to fragile watermarks?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cryptographically signed provenance — the C2PA standard and Content Credentials — binds tamper-evident, verifiable metadata to media. Unlike steganographic watermarks, a broken or stripped credential is detectable, which makes provenance auditable rather than merely probabilistic."
